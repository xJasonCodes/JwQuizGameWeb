<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Game - JW Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 20px; color: #14c669; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; text-align: left; }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #14c669; }
        
        .btn-primary {
            background: linear-gradient(90deg, #c6bd14, #14c669);
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Game</h1>
        <p style="color:#888; margin-bottom:20px;">Set up the game options. You'll get a room code to share with players.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Time per question (seconds)</label>
                <input type="number" name="timer_seconds" value="15" min="5" max="60">
            </div>
            <button type="submit" class="btn-primary">Create Room</button>
        </form>
    </div>
</body>
</html>
