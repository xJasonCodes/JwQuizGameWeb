<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Names - JW Quiz Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            background: linear-gradient(90deg, #673AB7, #2196f3);
            -webkit-background-clip: text;
            -webkit-background-color: #673AB7;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #2196f3;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #2196f3;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        button {
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary {
            background: linear-gradient(90deg, #673AB7, #2196f3);
            color: #1a1a2e;
            border: none;
        }
        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(20, 198, 105, 0.4);
        }
        .btn-secondary:hover {
            border-color: #2196f3;
        }
    </style>
</head>
<body>
    {% load custom_tags %}
    <div class="container">
        <h1>Enter Player Names</h1>
        <p class="subtitle">Max {{ max_rounds }} rounds available</p>
        
        <form action="{% url 'quiz_submit_names' %}" method="POST">
            {% csrf_token %}
            {% for i in num_players|times %}
            <div class="form-group">
                <label for="player_{{ i }}">Player {{ forloop.counter }}</label>
                <input type="text" name="player_{{ i }}" id="player_{{ i }}" placeholder="Enter nickname...">
            </div>
            {% endfor %}
            <div class="btn-container">
                <a href="{% url 'quiz_index' %}"><button type="button" class="btn-secondary">Back</button></a>
                <button type="submit" class="btn-primary">Continue</button>
            </div>
        </form>
    </div>
</body>
</html>
