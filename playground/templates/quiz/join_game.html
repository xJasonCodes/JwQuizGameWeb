<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Game - JW Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 20px; color: #2196f3; }
        .room-code { font-size: 2rem; color: #673AB7; margin: 20px 0; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; text-align: left; }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #673AB7, #2196f3);
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join Game</h1>
        <p class="room-code">Room: {{ room_code }}</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="player_name" placeholder="Enter your name" required>
            </div>
            <button type="submit" class="btn-primary">Join</button>
        </form>
    </div>
</body>
</html>
